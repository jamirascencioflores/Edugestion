server:
  port: 8081

spring:
  application:
    name: ms-auth
  datasource:
    url: jdbc:postgresql://${POSTGRES_SERVER}:5432/saas_auth_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:tu_password_aqui}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: tu-correo@gmail.com
    password: tu-contrasena-de-aplicacion
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/