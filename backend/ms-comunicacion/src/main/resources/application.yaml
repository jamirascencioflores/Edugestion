server:
  port: 8084

spring:
  application:
    name: ms-comunicacion
  datasource:
    url: jdbc:postgresql://${POSTGRES_SERVER}:5432/saas_academico_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:tu_password_aqui}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_SERVER:localhost}
    port: 5672

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/