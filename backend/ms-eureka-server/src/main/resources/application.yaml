server:
  port: 8761

spring:
  application:
    name: ms-eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    # ⚡ Desactiva el modo de autoprotección en desarrollo local para purgar instancias caídas de inmediato
    enable-self-preservation: false
    # ⚡ Intervalo de limpieza de instancias caídas (en milisegundos, por defecto 60000ms -> 60s)
    eviction-interval-timer-in-ms: 3000
    # ⚡ Tiempo de refresco del caché de respuesta de Eureka (en milisegundos, por defecto 30000ms -> 30s)
    response-cache-update-interval-ms: 3000