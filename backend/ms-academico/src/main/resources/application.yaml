server:
  port: 8082

spring:
  application:
    name: ms-academico
  datasource:
    url: jdbc:postgresql://${POSTGRES_SERVER}:5432/saas_academico_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: true # <--- Activa los logs de SQL
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true # <--- Formatea el SQL para que sea fácil de leer
  rabbitmq:
    host: ${RABBITMQ_SERVER:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/